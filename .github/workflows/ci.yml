name: Test project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-test-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile for reproducible CI installs
        run: npm install --package-lock-only
      - run: npm ci
      - run: npm run check
      - name: Syntax-check every JavaScript file
        run: |
          find bots tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check playwright.config.js
      - run: npx playwright install --with-deps chromium
      - name: Confirm test suite discovery
        run: npx playwright test --list
      - name: Run read-only staging smoke tests
        run: npm run smoke:staging
      - name: Run customer, operations, responsive and accessibility browser checks
        run: npx playwright test tests/customer.spec.js tests/operations.spec.js tests/responsive.spec.js tests/accessibility.spec.js tests/navigation.spec.js
      - name: Record visible UI inventory for selector calibration
        run: npx playwright test tests/ui-inventory.spec.js tests/route-inventory.spec.js
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
