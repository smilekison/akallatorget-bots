name: Test project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-test-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Confirm test suite discovery without running against a target
        run: npx playwright test --list
